name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Fetch the app source for the settings parity check
        run: git clone --depth 1 https://github.com/chr0nzz/traefik-manager .traefik-manager

      - name: Validate the templates
        run: pytest -q
